<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频下载助手</title>
<style>
body{font:16px 'Microsoft YaHei',sans-serif;background:#f4f7fb;color:#203047;margin:28px}h1{font-size:26px;margin:0 0 18px}small{color:#64748b}button,select,input{font:inherit}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:8px}button{padding:12px 18px;margin:14px 8px 0 0;border:0;border-radius:8px;background:#176bd1;color:white;cursor:pointer}button:disabled,select:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:8px;border-bottom:1px solid #cbd5e1;padding-bottom:12px}.tab{margin:0;background:#e2e8f0;color:#334155}.tab[aria-selected=true]{background:#176bd1;color:white}select{max-width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white}.quality{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;min-height:90px;border-radius:12px}.card{background:white;border-radius:12px;padding:20px;margin:20px 0}#status{font-weight:bold}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91bdf2;outline-offset:2px}[hidden]{display:none!important}
</style>
<h1>视频下载助手 <small>v0.2.0 试用版</small></h1>
<div class="tabs" role="tablist" aria-label="选择视频平台"><button class="tab" id="tab-bili" role="tab" aria-selected="true" aria-controls="panel" onclick="switchPlatform('bili')">B站下载</button><button class="tab" id="tab-douyin" role="tab" aria-selected="false" aria-controls="panel" onclick="switchPlatform('douyin')">抖音下载</button></div>
<div id="panel" role="tabpanel" aria-labelledby="tab-bili">
<p id="hint">首次在内置浏览器中扫码或使用 QQ 登录，以后可直接粘贴网址。</p><input id="url" aria-label="视频网址" placeholder="粘贴B站视频网址，或 BV 编号" oninput="states[active].url=this.value">
<div class="quality" id="quality-row" hidden><label for="quality">可用画质：</label><select id="quality" disabled onchange="states[active].quality=this.value"><option>解析后显示</option></select><small> 默认选最高可用画质</small></div>
<button id="login" onclick="send('login')">登录 / 显示浏览器</button><button id="parse" onclick="send('parse',{url:document.getElementById('url').value})">解析视频</button><button id="download" disabled onclick="send('download',{quality:document.getElementById('quality').value})">下载最高画质</button><button onclick="send('folder')">打开下载文件夹</button><button id="clear-url" onclick="clearUrl()">清空网址</button>
<div class="card"><p id="login-state">登录状态：等待检测</p><div id="status">就绪</div><p id="info">尚未解析视频</p><small>保存到 Windows 下载文件夹。两个平台分别保存登录状态。网页预览静音，下载文件保留声音。</small></div><pre id="log"></pre></div>
<script>
const defaults=p=>({url:'',login:p==='bili'?'等待检测':'尚未检测，点击登录 / 显示浏览器',status:'就绪',info:'尚未解析视频',log:p==='bili'?'使用顺序：登录 → 粘贴网址 → 解析视频 → 下载最高画质。':'使用顺序：粘贴单条视频链接 → 解析视频 → 选择可用画质 → 下载。\n需要登录或网页验证时，点击“登录 / 显示浏览器”。暂不支持搜索列表、图文、直播和批量下载。',ready:false,busy:false,formats:[],quality:''});
const states={bili:defaults('bili'),douyin:defaults('douyin')};let active='bili';
function render(){const s=states[active],dy=active==='douyin',locked=Object.values(states).some(x=>x.busy);document.getElementById('url').value=s.url;document.getElementById('url').placeholder=dy?'粘贴抖音单条视频网址，或分享短链接':'粘贴B站视频网址，或 BV 编号';document.getElementById('url').disabled=locked;document.getElementById('hint').textContent=dy?'抖音需单独登录，支持扫码或手机号登录。普通短视频可先尝试解析。':'首次在内置浏览器中扫码或使用 QQ 登录，以后可直接粘贴网址。';for(const p of ['bili','douyin']){const t=document.getElementById('tab-'+p);t.setAttribute('aria-selected',String(p===active));t.disabled=locked;}document.getElementById('panel').setAttribute('aria-labelledby','tab-'+active);document.getElementById('login-state').textContent='登录状态：'+s.login;for(const id of ['status','info','log'])document.getElementById(id).textContent=s[id];document.getElementById('download').textContent=dy?'下载所选画质':'下载最高画质';document.getElementById('download').disabled=!s.ready||locked;document.getElementById('parse').disabled=locked;document.getElementById('login').disabled=locked;document.getElementById('clear-url').disabled=locked;document.getElementById('quality-row').hidden=!dy;const q=document.getElementById('quality');q.replaceChildren();if(!s.formats.length){const o=document.createElement('option');o.textContent='解析后显示';q.append(o);}for(const f of s.formats){const o=document.createElement('option');o.value=f.id;o.textContent=f.label;q.append(o);}if(s.quality)q.value=s.quality;q.disabled=locked||!s.ready;}
function switchPlatform(p){if(Object.values(states).some(s=>s.busy))return;states[active].url=document.getElementById('url').value;active=p;render();send('platform-selected');}
function clearUrl(){const s=states[active];s.url='';s.ready=false;s.formats=[];s.quality='';s.status='就绪';s.info='尚未解析视频';s.log=defaults(active).log;render();send('clear');document.getElementById('url').focus();}
function send(action,extra={}){window.ipc.postMessage(JSON.stringify({action,platform:active,...extra}));}
window.update=x=>{const p=x.platform||'bili',s=states[p];if(!s)return;for(const key of ['status','info','log','ready','busy'])if(key in x)s[key]=x[key];if(x.formats){s.formats=x.formats;s.quality=x.formats[0]?.id||'';}if(p===active||'busy' in x)render();};
window.setLogin=(s,p='bili')=>{if(states[p]){states[p].login=s;if(p===active)render();}};
window.addEventListener('DOMContentLoaded',()=>{render();requestAnimationFrame(()=>{const input=document.getElementById('url');send('ui-ready',{buttons:document.querySelectorAll('button').length,tabs:document.querySelectorAll('[role=tab]').length,input:!!input,visible:input.getBoundingClientRect().width>0,update:typeof window.update==='function'});});});
</script></html>
